<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="280" viewBox="0 0 1280 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Grid Studio</title>
  <desc id="desc">Сетка героев — твой холст. Тёмная обложка с оранжевым штрихом по сетке.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="280" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10141c"/>
      <stop offset="1" stop-color="#1e1a19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1120 140) scale(350 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f56333" stop-opacity=".16"/>
      <stop offset="1" stop-color="#f56333" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#c4b7ae" stroke-opacity=".12"/>
    </pattern>
    <linearGradient id="stroke" x1="960" y1="224" x2="1152" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f56333"/>
      <stop offset="1" stop-color="#ffb27b"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="280" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <path fill="url(#background)" d="M0 0h1280v280H0z"/>
    <path fill="url(#glow)" d="M0 0h1280v280H0z"/>
    <path fill="url(#grid)" d="M816 0h464v280H816z"/>
    <g fill="#f56333" fill-opacity=".1" stroke="#f56333" stroke-opacity=".2">
      <rect x="913" y="193" width="46" height="46" rx="8"/>
      <rect x="961" y="145" width="46" height="46" rx="8"/>
      <rect x="1009" y="97" width="46" height="46" rx="8"/>
      <rect x="1057" y="49" width="46" height="46" rx="8"/>
      <rect x="1105" y="1" width="46" height="46" rx="8"/>
    </g>
    <path d="M936 216 1128 24" stroke="#f56333" stroke-opacity=".06" stroke-width="70" stroke-linecap="round"/>
    <path d="M936 216 1128 24" stroke="url(#stroke)" stroke-width="17" stroke-linecap="round"/>
    <circle cx="1176" cy="216" r="5" fill="#f56333"/>
    <path d="M1194 216h40" stroke="#f56333" stroke-opacity=".35"/>
    <rect x="56" y="43" width="32" height="32" rx="9" fill="#30241f"/>
    <path d="m65 66 14-14" stroke="#f56333" stroke-width="4.5" stroke-linecap="round"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <text x="102" y="65" fill="#b3a69f" font-size="15" font-weight="600" letter-spacing="3">DOTA 2 / CREATIVE TOOLS</text>
      <text x="52" y="155" fill="#f8f5f1" font-size="78" font-weight="800" letter-spacing="-3">GRID STUDIO</text>
      <text x="56" y="211" fill="#b7b4b3" font-size="27">Сетка героев — твой холст.</text>
    </g>
    <path d="M56 250h48" stroke="#f56333" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
