<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Редактор · Dota 2 Grid Studio</title>
<meta name="description" content="Рисуй ASCII-арт, line-art и мозаику из героев прямо в сетке героев Dota 2 и получай готовый hero_grid_config.json. Работает в браузере, без установки.">
<meta name="theme-color" content="#0f0d0c">
<meta property="og:title" content="Dota 2 Grid Studio">
<meta property="og:description" content="Редактор кастомных сеток героев Dota 2: ASCII-арт, line-art и мозаика из героев с превью как в игре.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://shttps.github.io/GridPainter/docs/ingame.webp">
<link rel="canonical" href="https://shttps.github.io/GridPainter/editor.html">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=41">
<script>
  // тема до первой отрисовки — чтобы не мигало; по умолчанию тёмная, как в макете
  try { document.documentElement.dataset.theme = localStorage.getItem('gp2.theme') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="canvas"></canvas>

  <div class="empty-state" id="emptyState" hidden>
    <button class="es-drop" data-add="image">
      <span class="es-ico" data-icon="image"></span>
      <span class="es-title">Брось картинку сюда</span>
      <span class="es-sub">или нажми <kbd>Ctrl V</kbd> — line-art, ASCII или мозаика из героев</span>
    </button>
    <div class="es-actions">
      <button class="pill" id="esOpen" data-icon="folder">Открыть JSON</button>
      <button class="pill" data-add="ascii" data-icon="ascii">ASCII</button>
      <a class="pill" href="workshop.html" data-icon="layers">Сетки игроков</a>
    </div>
    <div class="es-hint">или <kbd>Ctrl K</kbd> — все команды</div>
  </div>

  <!-- слева сверху: знак, название сетки, меню файла -->
  <header class="float brand-pill" id="brandPill">
    <a class="brand-logo" href="index.html" title="На главную">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" class="lg-bg"/><path d="M13 35L35 13" class="lg-stroke"/></svg>
    </a>
    <div class="brand-text">
      <input class="title-input" id="configName" spellcheck="false" title="Название сетки в Доте" aria-label="Название сетки">
      <span class="brand-sub">Grid Studio · <span id="saveState">сохранено</span><span id="cloudState"></span></span>
    </div>
    <div class="menu-wrap">
      <button class="icon-btn sm" id="btnMenu" data-icon="chev" aria-label="Меню"></button>
      <div class="menu menu-rich" id="mainMenu">
        <div class="menu-head">
          <svg class="mh-mark" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" class="lg-bg"/><path d="M13 35L35 13" class="lg-stroke"/></svg>
          <span><b id="menuName">Моя сетка</b><small id="menuStats">пусто</small></span>
        </div>
        <div class="menu-sec">Файл</div>
        <button data-cmd="open" data-icon="folder"><span>Открыть JSON…<small>hero_grid_config.json из папки Доты</small></span><kbd>Ctrl O</kbd></button>
        <button data-cmd="export" data-icon="download"><span>Экспорт<small>скачать или записать в файл игры</small></span><kbd>Ctrl S</kbd></button>
        <button data-cmd="publish" data-icon="upload"><span>Выложить в Мастерскую<small>поделиться сеткой с игроками</small></span></button>
        <div id="menuAccount"></div>
        <hr>
        <div class="menu-theme"><span>Тема</span><div class="seg" id="themeSeg"><button data-theme-v="dark" data-icon="moon">Тёмная</button><button data-theme-v="light" data-icon="sun">Светлая</button></div></div>
        <div class="menu-tiles four">
          <a href="workshop.html" data-icon="grid">Мастерская</a>
          <a href="guides.html" data-icon="book">Гайды</a>
          <button data-cmd="tour" data-icon="spark">Подсказки</button>
          <button data-cmd="help" data-icon="help">Клавиши</button>
        </div>
      </div>
    </div>
  </header>

  <!-- по центру: редактор / как в игре -->
  <div class="float seg-switch" id="viewSwitch" role="tablist">
    <span class="seg-ind" id="segInd"></span>
    <button data-view="editor" class="on" data-icon="pencil" role="tab">Редактор</button>
    <button data-view="game" data-icon="eye" role="tab" data-tip="Как в игре · Tab">В игре</button>
  </div>
  <!-- вкладки: несколько холстов, переключаются без потери правок -->
  <nav class="float doc-tabs" id="docTabs" aria-label="Холсты" hidden></nav>
  <!-- в превью «В игре»: что под сеткой — фон Доты или свой фон меню (собирается на странице «Фон меню») -->
  <button class="float pill game-bg" id="gameBg" data-icon="image"><span>Фон: как в Dota</span></button>

  <!-- справа сверху: команды, Мастерская, экспорт -->
  <div class="top-actions">
    <button class="float icon-btn box" id="btnCmd" data-icon="search" data-tip="Все команды · Ctrl K" aria-label="Команды"></button>
    <button class="float btn box" id="btnPublish" data-icon="upload" data-tip="Выложить в Мастерскую">В Мастерскую</button>
    <button class="float btn box" id="btnImport" data-icon="folder" data-tip="Открыть hero_grid_config.json · Ctrl O">Импорт</button>
    <button class="btn primary box" id="btnExport" data-icon="download">Экспорт</button>
  </div>

  <!-- слева: категории (объекты холста) -->
  <aside class="float layers" id="layers">
    <div class="layers-head">
      <span>Категории</span>
      <span class="badge" id="catCount" data-tip="Категорий в сетке">0</span>
      <div class="menu-wrap">
        <button class="icon-btn xs" id="btnAdd" data-icon="plus" aria-label="Добавить"></button>
        <div class="menu menu-rich" id="addMenu">
          <div class="menu-sec">Из картинки</div>
          <button data-add="image" data-icon="image" class="menu-hero"><span>Картинку…<small>line-art, ASCII или мозаика из героев</small></span><kbd>Ctrl V</kbd></button>
          <button data-add="steam" data-icon="font"><span>Арт для профиля Steam…<small>Брайль для «Своего информационного поля»</small></span></button>
          <div class="menu-sec">Готовое</div>
          <button data-add="ascii" data-icon="ascii"><span>ASCII из буфера<small>вставить готовый текстовый арт</small></span></button>
          <button data-add="lines" data-icon="lines"><span>Генератор линий<small>пунктиры, рамки, разделители</small></span></button>
          <hr>
          <div class="menu-tiles two">
            <button data-add="hero" data-icon="heroes">Категория героев</button>
            <button data-add="text" data-icon="text">Текст</button>
          </div>
        </div>
      </div>
    </div>
    <div class="layers-list" id="layersList"></div>
    <div class="layers-foot">Каждая фигура на холсте станет категорией в игре</div>
  </aside>

  <aside class="float inspector" id="inspector"></aside>

  <nav class="float dock" id="rail">
    <span class="dock-ind" id="dockInd"></span>
    <button data-tool="select" data-icon="cursor" data-tip="Выделение"><kbd>V</kbd></button>
    <button data-tool="pan" data-icon="hand" data-tip="Рука · пробел"><kbd>H</kbd></button>
    <span class="sep"></span>
    <button data-tool="pencil" data-icon="pencil" data-tip="Карандаш"><kbd>B</kbd></button>
    <button data-tool="line" data-icon="line" data-tip="Линия"><kbd>L</kbd></button>
    <button data-tool="hv" data-icon="hv" data-tip="Гор. / верт."><kbd>X</kbd></button>
    <button data-tool="rect" data-icon="rect" data-tip="Прямоугольник"><kbd>R</kbd></button>
    <button data-tool="ellipse" data-icon="ellipse" data-tip="Эллипс"><kbd>O</kbd></button>
    <button data-tool="rhombus" data-icon="rhombus" data-tip="Ромб"><kbd>D</kbd></button>
    <button data-tool="triangle" data-icon="triangle" data-tip="Треугольник"><kbd>Y</kbd></button>
    <button data-tool="eraser" data-icon="eraser" data-tip="Ластик"><kbd>E</kbd></button>
    <span class="sep"></span>
    <button data-tool="text" data-icon="text" data-tip="Текст"><kbd>T</kbd></button>
    <button data-tool="hero" data-icon="heroes" data-tip="Категория героев"><kbd>G</kbd></button>
  </nav>

  <!-- слева снизу: история и масштаб -->
  <div class="bottom-left">
    <div class="float mini">
      <button class="icon-btn sm" id="btnUndo" data-icon="undo" data-tip="Отменить · Ctrl+Z"></button>
      <button class="icon-btn sm" id="btnRedo" data-icon="redo" data-tip="Повторить · Ctrl+Shift+Z"></button>
    </div>
    <div class="float mini">
      <button class="icon-btn sm" id="zoomOut" data-icon="minus" data-tip="Отдалить · −"></button>
      <button class="zoom-val" id="zoomVal" data-tip="Вписать · Shift+1">100%</button>
      <button class="icon-btn sm" id="zoomIn" data-icon="plus" data-tip="Приблизить · +"></button>
    </div>
    <button class="float icon-btn box help-btn" id="btnHelp" data-icon="help" data-tip="Горячие клавиши · ?"></button>
  </div>

  <div class="status"><span id="stCoords">x — · y —</span><span class="dot">·</span><span id="stTool"></span><span id="stSel"></span></div>
</main>

<div class="modal-root" id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<input type="file" id="fileImage" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,application/json" multiple hidden>
<input type="file" id="fileBg" accept="image/*" hidden>
<input type="file" id="fileFont" accept=".ttf,.otf,.woff,.woff2" hidden>

<script src="heroes.js?v=37"></script>
<script src="convert.js?v=39"></script>
<script src="config.js?v=41"></script>
<script src="auth.js?v=38"></script>
<script src="gridrender.js?v=37"></script>
<script src="catalog-api.js?v=43"></script>
<script src="app.js?v=42"></script>
<script src="studio.js?v=38"></script>
</body>
</html>
